<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Vesta Companion</title><desc id="desc">Your personal assistant. Your own space. Download, unzip, open your folder.</desc><rect width="1200" height="420" rx="20" fill="#143c55"/><circle cx="1120" cy="335" r="210" fill="none" stroke="#dfc102" stroke-width="50" opacity=".16"/><path d="M70 65h45" stroke="#dfc102" stroke-width="7" stroke-linecap="round"/><g fill="#fff" font-family="Segoe UI,Arial,sans-serif"><text x="70" y="111" font-size="18" letter-spacing="5">VESTA COMPANION</text><text x="66" y="192" font-size="58" font-weight="600" letter-spacing="-2">Your personal assistant.</text><text x="66" y="258" font-size="58" font-weight="600" letter-spacing="-2">Your own space.</text><text x="70" y="319" font-size="21" fill="#c3d7e3">Portable memory. Clear priorities. A little more room in your day.</text><text x="70" y="377" font-size="14" fill="#dfc102" letter-spacing="2">DOWNLOAD  ·  UNZIP  ·  OPEN YOUR FOLDER</text></g></svg>
