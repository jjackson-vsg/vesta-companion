name: Kit checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Core checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test persistence, starter vault and release boundaries
        run: python -m unittest discover -s tests -v
      - name: Check generated adapters and demo
        run: python scripts/build.py --assets
      - name: Refuse stale generated files
        run: git diff --exit-code
      - name: Validate and build public release
        run: python scripts/build.py --check --package
      - name: Build the public guide and fictional demo site
        run: python scripts/build_site.py
